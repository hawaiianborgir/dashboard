<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="upper-header">
                <div class="upper-header__left">
                    <button type="button"></button>
                    <input type="search" name="" id="">
                </div>
                <div class="upper-header__right">
                    <img src="" alt="notification" class="notification">
                    <img src="" alt="profile-image" class="profile__upper">
                    <div>Hitori Gotoh</div>
                </div>
                
            </div>
            <div class="lower-header">
                <div class="lower-header__left">
                    <img src="" alt="profile-image" class="profile__lower">
                    <div>Hi there</div>
                    <div>Hitori Gotoh (@bocchi)</div>
                </div>
                <div class="lower-header__right">
                    <button type="button">New</button>
                    <button type="button">Upload</button>
                    <button type="button">Share</button>
                </div>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="logo-container">
                <img src="" alt="logo-image" class="logo-image">
                <div class="logo-font">Kessoku Band</div>
            </div>
            <div class="menu-container">
                <div class="menu-image">
                    <img src="" alt="home-icon">
                    <img src="" alt="profile-icon">
                    <img src="" alt="messages-icon">
                    <img src="" alt="history-icon">
                    <img src="" alt="task-icon">
                    <img src="" alt="communities-icon">
                </div>
                <ul class="menu">
                    <li>Home</li>
                    <li>Profile</li>
                    <li>Messages</li>
                    <li>History</li>
                    <li>Tasks</li>
                    <li>Communities</li>
                </ul>
            </div>
            <div class="setup-container">
                <div class="setup-image">
                    <img src="" alt="setting-icon">
                    <img src="" alt="support-icon">
                    <img src="" alt="privacy-icon">
                </div>
                <ul class="setting">
                    <li>Setting</li>
                    <li>Support</li>
                    <li>Privacy</li>
                </ul>
            </div>
        </div>
        
        
    </div>
</body>
</html>
